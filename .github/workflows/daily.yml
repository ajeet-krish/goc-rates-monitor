name: daily

on:
  schedule:
    # The Bank of Canada publishes day D benchmark bond yields at 10:00 EST
    # on D+1, which is 15:00 UTC, so any run before 15:00 UTC resolves to
    # D-1 and labels that stale print as D. This cron runs weekdays only at
    # 16:30 UTC (11:30 EST, 12:30 EDT), after the 15:00 UTC publication with
    # margin for GitHub scheduler delays, since observed run times drift by
    # up to about half an hour. Weekend runs do not happen, and the resolve
    # step computes the previous joint business day, so Monday's run targets
    # Friday, whose print is published Monday morning before 16:30 UTC.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Snapshot date YYYY-MM-DD, defaults to the previous joint business day."
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild even when the snapshot triple already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      date: ${{ steps.resolve.outputs.date }}
      sha: ${{ steps.done.outputs.sha }}
      commit_sha: ${{ steps.done.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - id: resolve
        run: |
          set -euo pipefail
          if [ -n "$DATE_INPUT" ]; then
            DATE_INPUT="$DATE_INPUT" uv run python -c "import os; from goc_rates.dates import parse_strict_iso_date; parse_strict_iso_date(os.environ['DATE_INPUT'])"
            DATE="$DATE_INPUT"
          else
            DATE="$(uv run python -c "import datetime; from zoneinfo import ZoneInfo; from goc_rates.calendar import previous_business_day; print(previous_business_day(datetime.datetime.now(ZoneInfo('America/Toronto')).date()).isoformat())")"
            DATE_INPUT="$DATE" uv run python -c "import os; from goc_rates.dates import parse_strict_iso_date; parse_strict_iso_date(os.environ['DATE_INPUT'])"
          fi
          echo "resolved snapshot date: $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
        env:
          TZ: America/Toronto
          DATE_INPUT: ${{ inputs.snapshot_date }}
      - id: wait_for_print
        run: |
          set -euo pipefail
          DATE="$SNAPSHOT_DATE"
          POLL_INTERVAL_SECONDS=300
          POLL_DEADLINE_SECONDS=2700
          deadline=$((SECONDS + POLL_DEADLINE_SECONDS))
          attempt=0
          echo "polling Valet for the benchmark print on $DATE"
          while :; do
            attempt=$((attempt + 1))
            if uv run python - <<'PY'
          import os
          import sys

          from goc_rates.clients.base import BaseClient
          from goc_rates.clients.valet import VALET_GROUP, fetch_valet_group
          from goc_rates.config import load_benchmark_map

          target_date = os.environ["SNAPSHOT_DATE"]
          benchmark_map = load_benchmark_map("config/benchmark_map.yaml")
          try:
              with BaseClient() as client:
                  groups = fetch_valet_group(
                      VALET_GROUP,
                      client,
                      start_date=target_date,
                      end_date=target_date,
                  )
          except Exception as exc:
              print(f"valet poll attempt failed: {exc}", file=sys.stderr)
              sys.exit(1)
          problems = []
          for tenor, entry in benchmark_map.benchmarks.items():
              rows = [
                  row
                  for row in groups.get(entry.valet_series_id, [])
                  if row.observation_date == target_date
              ]
              if not rows:
                  problems.append(f"{tenor}: no observation for {target_date}")
                  continue
              quantity = rows[0].quantity
              if quantity.get("quality") != "observed" or quantity.get("value") is None:
                  problems.append(f"{tenor}: value not observed")
          if problems:
              print("incomplete print for " + target_date + ": " + "; ".join(problems))
              sys.exit(1)
          print("complete print for " + target_date + " observed for all tenors")
          PY
            then
              echo "print for $DATE confirmed on attempt $attempt"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "attempt $attempt: print for $DATE not yet complete, retrying in $POLL_INTERVAL_SECONDS seconds"
            sleep "$POLL_INTERVAL_SECONDS"
          done
          echo "BoC print for $DATE not yet published after the 45 minute poll window; not snapshotting stale data"
          exit 1
        env:
          SNAPSHOT_DATE: ${{ steps.resolve.outputs.date }}
      - id: fetch
        run: |
          set -euo pipefail
          DATE="$SNAPSHOT_DATE"
          FORCE="$FORCE_REBUILD"
          if [ "$FORCE" != "true" ] && [ -f "snapshots/$DATE/snapshot.json" ] && [ -f "snapshots/$DATE/manifest.json" ] && [ -f "snapshots/$DATE/verify.json" ]; then
            echo "reusing existing triple for $DATE (force_rebuild not set)"
          else
            uv run python -m goc_rates snapshot --date "$DATE" --out "snapshots/$DATE" --config config/benchmark_map.yaml | tee snapshot_out.txt
            grep -q "SNAPSHOT_DATE=$DATE" snapshot_out.txt
          fi
          test -f "snapshots/$DATE/snapshot.json"
          test -f "snapshots/$DATE/manifest.json"
          uv run python -m goc_rates verify --snapshot "snapshots/$DATE/snapshot.json" --config config/benchmark_map.yaml
          test -f "snapshots/$DATE/verify.json"
          SNAPSHOT_DATE="$SNAPSHOT_DATE" uv run python -c "import json, os; from pathlib import Path; target = Path('snapshots') / os.environ['SNAPSHOT_DATE']; report = json.loads((target / 'verify.json').read_text()); snap = json.loads((target / 'snapshot.json').read_text()); obs = snap.get('observations') if isinstance(snap, dict) else None; inflation = obs.get('inflation') if isinstance(obs, dict) else None; has_inflation = isinstance(inflation, dict) and inflation.get('status') != 'missing'; expected = 22 if has_inflation else 18; assert report['passed'] is True, report; assert report['failed_count'] == 0, report; assert report['passed_count'] >= 18, report; assert report['passed_count'] == expected if has_inflation else report['passed_count'] >= expected, report"
          SNAPSHOT_DATE="$SNAPSHOT_DATE" uv run python -c "import hashlib, json, os; from pathlib import Path; target = Path('snapshots') / os.environ['SNAPSHOT_DATE']; raw = (target / 'snapshot.json').read_bytes(); manifest = json.loads((target / 'manifest.json').read_text()); digest = manifest.get('files', {}).get('snapshot.json', {}).get('sha256', manifest.get('snapshot.json', {}).get('sha256', '')); assert digest == hashlib.sha256(raw).hexdigest(), 'manifest sha mismatch'"
          SNAPSHOT_DATE="$SNAPSHOT_DATE" uv run python -c "import json, os; from pathlib import Path; snap = json.loads((Path('snapshots') / os.environ['SNAPSHOT_DATE'] / 'snapshot.json').read_text()); assert snap['metadata']['snapshot_date'] == os.environ['SNAPSHOT_DATE'], 'snapshot_date must equal dirname'"
          test -f "snapshots/$DATE/snapshot.json"
          test -f "snapshots/$DATE/verify.json"
          grep_status=0
          grep -ri "mock" "snapshots/$DATE/snapshot.json" "snapshots/$DATE/verify.json" "web/public/data/history.json" || grep_status=$?
          if [ "$grep_status" -eq 0 ]; then echo "mock marker found, refusing to publish"; exit 1; fi
          if [ "$grep_status" -ne 1 ]; then echo "mock scan failed with status $grep_status"; exit 1; fi
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: America/Toronto
          SNAPSHOT_DATE: ${{ steps.resolve.outputs.date }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
      - id: done
        run: |
          set -euo pipefail
          DATE="$RESOLVED_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "snapshots/$DATE/snapshot.json" "snapshots/$DATE/manifest.json" "snapshots/$DATE/verify.json"
          if git diff --cached --quiet; then
            echo "no changes to commit for $DATE"
          else
            git commit -m "snapshot $DATE [skip ci]"
            git push
          fi
          SHA="$(sha256sum "snapshots/$DATE/snapshot.json" | cut -d' ' -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          RESOLVED_DATE: ${{ steps.resolve.outputs.date }}

  build:
    runs-on: ubuntu-latest
    needs: snapshot
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.snapshot.outputs.commit_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:data
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: |
          set -euo pipefail
          LATEST="$(node -e "const fs = require('fs'); const doc = JSON.parse(fs.readFileSync('./dist/data/index.json', 'utf8')); console.log(doc.latest)")"
          test "$LATEST" = "$EXPECTED_DATE"
          test -f dist/.nojekyll
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/data/index.json
          test -f "dist/data/$EXPECTED_DATE/snapshot.json"
          test -f "dist/data/$EXPECTED_DATE/verify.json"
          grep_status=0
          grep -ri "mock" "dist/data/$EXPECTED_DATE/snapshot.json" "dist/data/$EXPECTED_DATE/verify.json" dist/data/history.json dist/index.html || grep_status=$?
          if [ "$grep_status" -eq 0 ]; then echo "mock marker found in dist, refusing to publish"; exit 1; fi
          if [ "$grep_status" -ne 1 ]; then echo "mock scan failed with status $grep_status"; exit 1; fi
          echo "build gates passed for $EXPECTED_DATE"
        env:
          EXPECTED_DATE: ${{ needs.snapshot.outputs.date }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
