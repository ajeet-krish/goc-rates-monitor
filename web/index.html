<!doctype html>

    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages, rafgraph spa-github-pages decoder.
      // Must run before the app bundle so /?/curve?asof=X restores on hard load.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
